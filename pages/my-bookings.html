<style>
  .booking-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--gray-200); }
  .booking-row:last-child { border-bottom: none; }
  .booking-row-info { flex: 1; min-width: 0; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

<div id="site-header"></div>

<main id="main">
  <section class="section">
    <div class="container" style="max-width:760px;">
      <div id="authGate" style="display:none;" class="state-block">
        <div class="state-icon">🔒</div>
        <div class="state-title">Please log in to view your bookings</div>
        <div style="margin-top:14px;"><a href="/pages/login.html?redirect=/pages/my-bookings.html" class="btn btn-primary">Login</a></div>
      </div>

      <div id="bookingsContent" style="display:none;">
        <div class="section-head" style="text-align:left;margin:0 0 6px;">
          <span class="section-eyebrow">My Account</span>
          <h1>My Bookings</h1>
        </div>
        <p style="font-size:12px;"><span class="live-dot"></span>Live — updates automatically when your booking status changes</p>
        <div id="bookingsList" class="card"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module">
  import { mountChrome } from '/assets/js/shared-chrome.js';
  import { supabase } from '/assets/js/supabase-client.js';
  import { fetchMyBookings } from '/assets/js/services/bookings.js';
  import { STAGE_META } from '/assets/js/tracker-shared.js';
  mountChrome('my-bookings');

  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    document.getElementById('authGate').style.display = 'block';
  } else {
    document.getElementById('bookingsContent').style.display = 'block';
    await loadBookings();
    subscribeRealtime(data.session.user.id);
  }

  function fmtDate(d) { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }

  async function loadBookings() {
    const listEl = document.getElementById('bookingsList');
    listEl.innerHTML = `<div class="state-block"><div class="state-icon">⏳</div><div class="state-title">Loading your bookings…</div></div>`;
    try {
      const bookings = await fetchMyBookings();
      if (!bookings.length) {
        listEl.innerHTML = `<div class="state-block">
          <div class="state-icon">📅</div>
          <div class="state-title">No bookings yet</div>
          <div class="state-desc">Book a test or package to see it here.</div>
          <div style="margin-top:14px;"><a href="/pages/packages.html" class="btn btn-primary">Browse Packages</a></div>
        </div>`;
        return;
      }
      listEl.innerHTML = bookings.map(b => {
        const meta = STAGE_META[b.stage] || STAGE_META.booked;
        const itemName = b.booking_items?.[0]?.name_snapshot || 'Test/Package';
        return `
          <div class="booking-row">
            <div class="booking-row-info">
              <div style="font-weight:700;font-size:14px;">${itemName}</div>
              <div style="font-size:12px;color:var(--text-muted);">${b.booking_code} · ${fmtDate(b.scheduled_date)}</div>
            </div>
            <span class="badge" style="background:${meta.color}22;color:${meta.color};">${meta.icon} ${meta.customerLabel}</span>
            <a href="/pages/track-booking.html?code=${encodeURIComponent(b.booking_code)}" class="btn btn-outline" style="font-size:12px;padding:8px 14px;">Track</a>
          </div>`;
      }).join('');
    } catch (e) {
      listEl.innerHTML = `<div class="state-block"><div class="state-icon">⚠️</div><div class="state-title">Couldn't load your bookings</div><div class="state-desc">${e.message || 'Please try again.'}</div></div>`;
    }
  }

  // Real Supabase Realtime — RLS still applies to what this channel can
  // see, so this only ever fires for this user's own rows. This is the
  // genuine push-based path (vs. the public tracker's polling for
  // guests, who have no session for Realtime to authorize against).
  function subscribeRealtime(userId) {
    supabase
      .channel('my-bookings-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `user_id=eq.${userId}` }, () => {
        loadBookings();
      })
      .subscribe();
  }
</script>
</html>
