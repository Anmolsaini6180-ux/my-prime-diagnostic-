<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Booking | My Prime Diagnostic</title>
<meta name="description" content="Track the status of your My Prime Diagnostic booking — from sample collection to report ready.">
<link rel="canonical" href="https://myprimediagnostic.in/pages/track-booking.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/booking.css">
<style>
  .track-wrap { max-width: 640px; margin: 0 auto; }
</style>
</head>

<div id="site-header"></div>

<main id="main">
  <section class="section">
    <div class="container track-wrap">
      <div class="section-head">
        <span class="section-eyebrow">Track Booking</span>
        <h1>Where's my sample?</h1>
        <p>Enter your Booking ID and mobile number to check your status.</p>
      </div>

      <form id="trackForm" class="card">
        <div class="field">
          <label for="trkId">Booking ID</label>
          <input type="text" id="trkId" placeholder="e.g. MPD-7X9K2M" required style="text-transform:uppercase;">
        </div>
        <div class="field">
          <label for="trkPhone">Mobile Number</label>
          <input type="tel" id="trkPhone" maxlength="10" placeholder="10-digit mobile used at booking" required>
          <div class="field-error" id="trkPhoneErr">Enter a valid 10-digit mobile number.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="trackSubmitBtn">Track My Booking</button>
      </form>

      <div id="trackResult" style="margin-top:24px;"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module">
  import { mountChrome } from '/assets/js/shared-chrome.js';
  import { trackBooking, trackBookingTimeline } from '/assets/js/services/bookings.js';
  import { STAGE_FLOW, STAGE_META, stageIndex, isTerminalException } from '/assets/js/tracker-shared.js';
  mountChrome('track-booking');

  const prefillCode = new URLSearchParams(location.search).get('code');
  if (prefillCode) document.getElementById('trkId').value = prefillCode;

  let pollTimer = null;

  function renderTimeline(booking, history) {
    const historyMap = {};
    history.forEach(h => { if (!historyMap[h.new_status]) historyMap[h.new_status] = h.created_at; });

    const exception = isTerminalException(booking.stage);
    const currentIdx = exception ? -1 : stageIndex(booking.stage);

    const rows = STAGE_FLOW.map((key, i) => {
      const meta = STAGE_META[key];
      const done = !exception && i < currentIdx;
      const current = !exception && i === currentIdx;
      const cls = done ? 'done' : current ? 'current' : 'upcoming';
      const ts = historyMap[key];
      return `
        <div class="timeline-item ${cls}">
          <div class="timeline-dot">${done ? '✓' : meta.icon}</div>
          <div class="timeline-content">
            <div class="timeline-label">${meta.customerLabel}</div>
            ${ts ? `<div class="timeline-time">${new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const exceptionBanner = exception
      ? `<div class="badge badge-orange" style="margin-bottom:16px;font-size:12px;padding:6px 14px;">${STAGE_META[booking.stage].icon} ${STAGE_META[booking.stage].customerLabel}</div>`
      : '';

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-weight:800;font-size:17px;">${booking.patient_name}</div>
            <div style="font-size:12.5px;color:var(--text-muted);">${booking.item_name || ''} · ${booking.booking_code}</div>
          </div>
          <button class="btn btn-ghost" id="refreshBtn" style="font-size:12px;padding:8px 14px;" title="Live updates for guests use polling, not push — see BOOKING_IMPLEMENTATION.md"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        ${exceptionBanner}
        <div class="meta-row" style="margin-bottom:18px;">
          <span class="meta-item">📅 ${new Date(booking.scheduled_date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}, ${booking.slot_label}</span>
          <span class="meta-item">${booking.collection_type === 'home' ? '🏠 Home Collection' : '🏥 Walk-in at Lab'}</span>
          ${booking.city ? `<span class="meta-item">📍 ${booking.city}</span>` : ''}
        </div>
        <div class="timeline-vertical timeline-horizontal">${rows}</div>
        <p style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:18px;margin-bottom:0;">This page checks for updates automatically every 25 seconds.</p>
      </div>`;
  }

  async function doTrack(code, phone, isPoll) {
    const resultEl = document.getElementById('trackResult');
    if (!isPoll) {
      resultEl.innerHTML = `<div class="state-block"><div class="state-icon">⏳</div><div class="state-title">Looking up your booking…</div></div>`;
    }
    try {
      const [booking, history] = await Promise.all([
        trackBooking(code, phone),
        trackBookingTimeline(code, phone),
      ]);
      if (!booking) {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        resultEl.innerHTML = `<div class="state-block">
          <div class="state-icon">🔍</div>
          <div class="state-title">No matching booking found</div>
          <div class="state-desc">Double-check your Booking ID and the mobile number used at booking. Still stuck? <a href="tel:+917428456590">Call us</a>.</div>
        </div>`;
        return;
      }
      resultEl.innerHTML = renderTimeline(booking, history);
      document.getElementById('refreshBtn').addEventListener('click', () => doTrack(code, phone, false));

      if (!pollTimer) {
        pollTimer = setInterval(() => doTrack(code, phone, true), 25000);
      }
    } catch (e) {
      if (!isPoll) {
        resultEl.innerHTML = `<div class="state-block"><div class="state-icon">⚠️</div><div class="state-title">Something went wrong</div><div class="state-desc">${e.message || 'Please try again.'}</div></div>`;
      }
    }
  }

  document.getElementById('trackForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = document.getElementById('trkId').value.trim().toUpperCase();
    const phone = document.getElementById('trkPhone').value.trim();
    const phoneErr = document.getElementById('trkPhoneErr');
    if (!/^[6-9]\d{9}$/.test(phone)) { phoneErr.classList.add('show'); return; }
    phoneErr.classList.remove('show');
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    doTrack(code, phone, false);
  });

  window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
</script>
</html>
