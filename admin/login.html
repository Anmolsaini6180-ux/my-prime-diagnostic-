<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | My Prime Diagnostic</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
  body { background: var(--blue-dark); }
  .admin-login-wrap { max-width: 380px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
  .admin-login-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 32px 28px; }
  .admin-login-brand { text-align: center; margin-bottom: 24px; }
  .admin-login-brand-icon { font-size: 32px; margin-bottom: 8px; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1.5px solid var(--gray-200); color: var(--text); }
  .btn-google:hover { background: var(--gray-50); }
  .auth-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--text-muted); font-size: 12px; }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
</style>
</head>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <img src="/assets/img/logo.jpg" alt="My Prime Diagnostic" width="56" height="56" style="border-radius:10px;">
      <h1 style="font-size:18px;margin-bottom:2px;">My Prime Diagnostic</h1>
      <p style="font-size:12.5px;margin:0;">Staff &amp; Admin Sign In</p>
    </div>

    <div id="deniedMsg" class="auth-msg error" style="display:none;">This account doesn't have staff access.</div>
    <div id="errMsg" class="auth-msg error" style="display:none;"></div>

    <form id="adminLoginForm">
      <div class="field">
        <label for="aEmail">Email</label>
        <input type="email" id="aEmail" required>
      </div>
      <div class="field">
        <label for="aPassword">Password</label>
        <input type="password" id="aPassword" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="adminLoginBtn">Sign In</button>
    </form>

    <div class="auth-divider">OR</div>
    <button type="button" class="btn btn-google btn-block btn-lg" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p style="text-align:center;font-size:11.5px;margin-top:18px;"><a href="/index.html">← Back to public site</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from '/assets/js/supabase-client.js';

  const STAFF_ROLES = ['main_admin', 'sub_admin', 'collection_agent'];
  const errEl = document.getElementById('errMsg');

  if (new URLSearchParams(location.search).get('denied')) {
    document.getElementById('deniedMsg').style.display = 'block';
  }

  // Shared by: an already-existing session found on load, and a fresh
  // Google OAuth redirect landing back on this page. Same rule either
  // way — a non-staff account is denied and signed out, never quietly
  // redirected somewhere else, since this IS the admin entry point.
  async function checkStaffAndRoute() {
    const { data } = await supabase.auth.getSession();
    if (!data.session) return;

    const { data: profile } = await supabase.from('profiles').select('role,status').eq('id', data.session.user.id).maybeSingle();
    if (profile && STAFF_ROLES.includes(profile.role) && profile.status === 'active') {
      location.href = '/admin/dashboard.html';
    } else {
      await supabase.auth.signOut();
      errEl.textContent = "This account doesn't have staff access.";
      errEl.style.display = 'block';
    }
  }
  checkStaffAndRoute();
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_IN') checkStaffAndRoute();
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    errEl.style.display = 'none';
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/admin/login.html' },
    });
    if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; }
  });

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    const btn = document.getElementById('adminLoginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('aEmail').value.trim(),
      password: document.getElementById('aPassword').value,
    });
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
      return;
    }

    await checkStaffAndRoute();
    btn.disabled = false; btn.textContent = 'Sign In';
  });
</script>
</html>
