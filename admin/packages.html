<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages | Admin | My Prime Diagnostic</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>

<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar"></div>
    <div class="admin-content">
      <div id="readonlyBanner"></div>
      <div class="admin-toolbar">
        <div class="catalog-search" style="max-width:280px;"><i class="fas fa-search" style="color:var(--text-muted);"></i><input type="search" id="searchInput" placeholder="Search packages…"></div>
        <button type="button" class="btn btn-primary" id="addBtn" style="margin-left:auto;display:none;"><i class="fas fa-plus"></i> Add Package</button>
      </div>
      <div class="admin-table-wrap"><div id="listRoot" style="overflow-x:auto;"></div></div>
    </div>
  </div>
</div>

<div class="admin-modal-backdrop" id="modalBackdrop">
  <div class="admin-modal">
    <button class="admin-modal-close" id="modalClose">&times;</button>
    <h3 id="modalTitle">Add Package</h3>
    <div class="field"><label>Name *</label><input type="text" id="fName"></div>
    <div class="field"><label>Slug * (URL-safe)</label><input type="text" id="fSlug"></div>
    <div class="field"><label>Description</label><textarea id="fDescription" style="width:100%;box-sizing:border-box;"></textarea></div>
    <div style="display:grid;gap:12px;grid-template-columns:1fr 1fr;">
      <div class="field"><label>Price (₹) *</label><input type="number" id="fPrice" min="0" step="0.01"></div>
      <div class="field"><label>Original Price (₹, optional — for strikethrough)</label><input type="number" id="fOriginalPrice" min="0" step="0.01"></div>
    </div>
    <div style="display:grid;gap:12px;grid-template-columns:1fr 1fr;">
      <div class="field"><label>Report Time</label><input type="text" id="fReportTime" placeholder="e.g. 24 hours"></div>
      <div class="field"><label>Sample Type</label><input type="text" id="fSampleType" placeholder="e.g. Blood"></div>
    </div>
    <div class="field"><label>Tests Included (one per line — shown to customers)</label><textarea id="fTests" style="width:100%;box-sizing:border-box;" placeholder="Complete Blood Count&#10;Lipid Profile&#10;Liver Function Test"></textarea></div>
    <div class="field"><label>Features (one per line — shown as ticks on the package card)</label><textarea id="fFeatures" style="width:100%;box-sizing:border-box;" placeholder="Free home sample collection&#10;Reports on WhatsApp/Email"></textarea></div>
    <div class="field"><label><input type="checkbox" id="fFeatured" style="width:auto;margin-right:6px;"> Featured (highlighted on the Packages page)</label></div>
    <div class="field"><label><input type="checkbox" id="fActive" checked style="width:auto;margin-right:6px;"> Active (visible on public site)</label></div>
    <div id="formMsg" style="font-size:13px;margin-bottom:10px;"></div>
    <button type="button" class="btn btn-primary btn-block" id="saveBtn">Save</button>
  </div>
</div>

<script type="module">
  import { requireStaffSession } from '/assets/js/admin-guard.js';
  import { mountAdminShell } from '/assets/js/admin-shell.js';
  import { supabase } from '/assets/js/supabase-client.js';
  import { showToast, confirmDialog } from '/assets/js/admin-ui.js';

  const session = await requireStaffSession();
  const isMainAdmin = session?.role === 'main_admin';
  if (session) {
    mountAdminShell({ currentKey: 'packages', title: 'Packages', profile: session.profile });
    if (isMainAdmin) {
      document.getElementById('addBtn').style.display = 'inline-flex';
      document.getElementById('addBtn').addEventListener('click', () => openModal(null));
    } else {
      document.getElementById('readonlyBanner').innerHTML = `<div class="admin-readonly-banner"><i class="fas fa-eye"></i> Read-only — only Main Admin can add, edit, or deactivate packages.</div>`;
    }
    load();
  }

  let allPackages = [];
  async function load() {
    const root = document.getElementById('listRoot');
    root.innerHTML = `<div class="state-block"><div class="state-icon">⏳</div></div>`;
    try {
      const { data, error } = await supabase.from('packages').select('*, package_tests(label), package_features(feature)').order('sort_order');
      if (error) throw error;
      allPackages = data || [];
      render();
    } catch (e) {
      root.innerHTML = `<div class="state-block"><div class="state-icon">⚠️</div><div class="state-desc">${e.message}</div></div>`;
    }
  }

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const items = q ? allPackages.filter(p => p.name.toLowerCase().includes(q)) : allPackages;
    const root = document.getElementById('listRoot');
    if (!items.length) { root.innerHTML = `<div class="state-block"><div class="state-icon">📦</div><div class="state-title">No packages found</div></div>`; return; }
    root.innerHTML = `<table class="admin-table"><thead><tr><th>Name</th><th>Price</th><th>Tests</th><th>Status</th>${isMainAdmin ? '<th>Actions</th>' : ''}</tr></thead><tbody>
      ${items.map(p => `<tr>
        <td data-label="Name">${p.emoji || '📦'} ${p.name} ${p.featured ? '<span class="badge badge-orange">Featured</span>' : ''}</td>
        <td data-label="Price">₹${Number(p.price).toLocaleString('en-IN')} ${p.original_price ? `<s style="color:var(--text-muted);font-size:11px;">₹${Number(p.original_price).toLocaleString('en-IN')}</s>` : ''}</td>
        <td data-label="Tests">${p.package_tests?.length || 0} tests</td>
        <td data-label="Status"><span class="badge ${p.is_active ? 'badge-green' : 'badge-gray'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
        ${isMainAdmin ? `<td data-label="Actions">
          <button type="button" class="btn btn-ghost editBtn" data-id="${p.id}" style="font-size:11.5px;padding:5px 8px;">Edit</button>
          <button type="button" class="btn btn-ghost toggleBtn" data-id="${p.id}" data-active="${p.is_active}" style="font-size:11.5px;padding:5px 8px;color:${p.is_active ? 'var(--danger)' : 'var(--success)'};">${p.is_active ? 'Deactivate' : 'Activate'}</button>
        </td>` : ''}
      </tr>`).join('')}
    </tbody></table>`;

    root.querySelectorAll('.editBtn').forEach(b => b.addEventListener('click', () => openModal(allPackages.find(p => p.id === b.dataset.id))));
    root.querySelectorAll('.toggleBtn').forEach(b => b.addEventListener('click', async () => {
      const willActivate = b.dataset.active === 'false';
      const confirmed = await confirmDialog(`${willActivate ? 'Activate' : 'Deactivate'} this package? ${willActivate ? '' : 'It will disappear from the public site immediately.'}`, { confirmLabel: willActivate ? 'Activate' : 'Deactivate', danger: !willActivate });
      if (!confirmed) return;
      try {
        const { error } = await supabase.from('packages').update({ is_active: willActivate }).eq('id', b.dataset.id);
        if (error) throw error;
        showToast(willActivate ? 'Package activated' : 'Package deactivated', 'success');
        load();
      } catch (e) { showToast(e.message, 'error'); }
    }));
  }
  document.getElementById('searchInput').addEventListener('input', render);

  let editingId = null;
  function openModal(pkg) {
    editingId = pkg?.id || null;
    document.getElementById('modalTitle').textContent = pkg ? 'Edit Package' : 'Add Package';
    document.getElementById('fName').value = pkg?.name || '';
    document.getElementById('fSlug').value = pkg?.slug || '';
    document.getElementById('fDescription').value = pkg?.description || '';
    document.getElementById('fPrice').value = pkg?.price || '';
    document.getElementById('fOriginalPrice').value = pkg?.original_price || '';
    document.getElementById('fReportTime').value = pkg?.report_time || '';
    document.getElementById('fSampleType').value = pkg?.sample_type || '';
    document.getElementById('fTests').value = (pkg?.package_tests || []).map(t => t.label).join('\n');
    document.getElementById('fFeatures').value = (pkg?.package_features || []).map(f => f.feature).join('\n');
    document.getElementById('fFeatured').checked = !!pkg?.featured;
    document.getElementById('fActive').checked = pkg ? pkg.is_active : true;
    document.getElementById('formMsg').textContent = '';
    document.getElementById('modalBackdrop').classList.add('open');
  }
  document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalBackdrop').classList.remove('open'));

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('formMsg');
    const name = document.getElementById('fName').value.trim();
    const slug = document.getElementById('fSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
    const price = Number(document.getElementById('fPrice').value);
    if (!name || !slug || !(price >= 0)) { msgEl.textContent = 'Name, slug, and a valid price are required.'; msgEl.style.color = 'var(--danger)'; return; }

    const payload = {
      name, slug, price,
      description: document.getElementById('fDescription').value.trim() || null,
      original_price: document.getElementById('fOriginalPrice').value ? Number(document.getElementById('fOriginalPrice').value) : null,
      report_time: document.getElementById('fReportTime').value.trim() || null,
      sample_type: document.getElementById('fSampleType').value.trim() || null,
      featured: document.getElementById('fFeatured').checked,
      is_active: document.getElementById('fActive').checked,
    };
    const testLines = document.getElementById('fTests').value.split('\n').map(l => l.trim()).filter(Boolean);
    const featureLines = document.getElementById('fFeatures').value.split('\n').map(l => l.trim()).filter(Boolean);

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      let packageId = editingId;
      if (editingId) {
        const { error } = await supabase.from('packages').update(payload).eq('id', editingId);
        if (error) throw error;
        // Replace the tests/features snapshot lists wholesale — simplest
        // correct way to keep them in sync with the textarea's edits
        // (order-preserving via sort_order) without a bespoke diff/reorder UI.
        await supabase.from('package_tests').delete().eq('package_id', editingId);
        await supabase.from('package_features').delete().eq('package_id', editingId);
      } else {
        const { data, error } = await supabase.from('packages').insert(payload).select('id').single();
        if (error) throw error;
        packageId = data.id;
      }
      if (testLines.length) {
        await supabase.from('package_tests').insert(testLines.map((label, i) => ({ package_id: packageId, label, sort_order: i })));
      }
      if (featureLines.length) {
        await supabase.from('package_features').insert(featureLines.map((feature, i) => ({ package_id: packageId, feature, sort_order: i })));
      }
      showToast(editingId ? 'Package updated' : 'Package created', 'success');
      document.getElementById('modalBackdrop').classList.remove('open');
      load();
    } catch (e) {
      msgEl.textContent = '❌ ' + e.message; msgEl.style.color = 'var(--danger)';
    }
    btn.disabled = false; btn.textContent = 'Save';
  });
</script>
</html>
