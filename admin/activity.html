<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Log | Admin | My Prime Diagnostic</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>

<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="admin-topbar"></div>
    <div class="admin-content">
      <div id="scopeBanner"></div>
      <div class="admin-toolbar">
        <select id="entityFilter" class="admin-input" style="padding:9px 12px;border-radius:8px;border:1.5px solid var(--gray-200);font-size:13px;">
          <option value="all">All Types</option>
          <option value="booking">Bookings</option>
          <option value="tests">Tests</option>
          <option value="packages">Packages</option>
          <option value="coupons">Coupons</option>
          <option value="profiles">Staff</option>
          <option value="app_settings">Settings</option>
        </select>
      </div>
      <div class="admin-table-wrap"><div id="listRoot" style="overflow-x:auto;"></div></div>
    </div>
  </div>
</div>

<script type="module">
  import { requireStaffSession } from '/assets/js/admin-guard.js';
  import { mountAdminShell } from '/assets/js/admin-shell.js';
  import { supabase } from '/assets/js/supabase-client.js';

  const session = await requireStaffSession();
  if (session) {
    mountAdminShell({ currentKey: 'activity', title: 'Activity Log', profile: session.profile });
    if (session.role === 'sub_admin') {
      document.getElementById('scopeBanner').innerHTML = `<div class="admin-readonly-banner"><i class="fas fa-eye"></i> Showing your own actions plus activity on bookings you can access — Main Admin sees the full log.</div>`;
    }
    load();
  }

  async function load() {
    const root = document.getElementById('listRoot');
    root.innerHTML = `<div class="state-block"><div class="state-icon">⏳</div></div>`;
    try {
      const entity = document.getElementById('entityFilter').value;
      let q = supabase.from('activity_log').select('*').order('created_at', { ascending: false }).limit(200);
      if (entity !== 'all') q = q.eq('entity_type', entity);
      const { data, error } = await q;
      if (error) throw error;
      render(data || []);
    } catch (e) {
      root.innerHTML = `<div class="state-block"><div class="state-icon">⚠️</div><div class="state-desc">${e.message}</div></div>`;
    }
  }

  function render(rows) {
    const root = document.getElementById('listRoot');
    if (!rows.length) { root.innerHTML = `<div class="state-block"><div class="state-icon">📋</div><div class="state-title">No activity recorded yet</div></div>`; return; }
    root.innerHTML = `<table class="admin-table"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td data-label="When">${new Date(r.created_at).toLocaleString('en-IN')}</td>
        <td data-label="Actor">${r.actor_name || '—'} ${r.actor_role ? `<span style="color:var(--text-muted);font-size:11px;">(${r.actor_role})</span>` : ''}</td>
        <td data-label="Action"><span class="badge badge-blue">${r.action.replace(/_/g, ' ')}</span></td>
        <td data-label="Entity">${r.entity_type}${r.entity_id ? ' · ' + r.entity_id.slice(0, 8) : ''}</td>
        <td data-label="Details" style="max-width:280px;font-size:11.5px;color:var(--text-muted);word-break:break-word;">${r.metadata ? JSON.stringify(r.metadata) : '—'}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  document.getElementById('entityFilter').addEventListener('change', load);
</script>
</html>
