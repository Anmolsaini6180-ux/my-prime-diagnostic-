<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Details | My Prime Diagnostic</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/booking.css">
</head>

<div id="site-header"></div>

<main id="main">
  <section class="section">
    <div class="container wizard-wrap">
      <div id="stepperRoot"></div>
      <div id="summaryRoot"></div>

      <div class="card wizard-card">
        <h1 style="font-size:20px;">Patient Details</h1>
        <p style="font-size:13px;">Who is this test for?</p>

        <form id="patientForm">
          <div class="field">
            <label for="pName">Full Name *</label>
            <input type="text" id="pName" required>
            <div class="field-error" id="pNameErr">Enter at least 2 letters (letters and spaces only).</div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="pPhone">Mobile Number *</label>
              <input type="tel" id="pPhone" maxlength="10" required>
              <div class="field-error" id="pPhoneErr">Valid 10-digit number starting with 6-9.</div>
            </div>
            <div class="field">
              <label for="pEmail">Email (optional)</label>
              <input type="email" id="pEmail">
              <div class="field-error" id="pEmailErr">Enter a valid email address.</div>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="pDob">Date of Birth (optional)</label>
              <input type="date" id="pDob">
            </div>
            <div class="field">
              <label for="pGender">Gender (optional)</label>
              <select id="pGender">
                <option value="">Prefer not to say</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="wizard-nav">
            <a href="/pages/packages.html" class="btn btn-ghost">Back</a>
            <button type="submit" class="btn btn-primary">Continue</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module">
  import { mountChrome } from '/assets/js/shared-chrome.js';
  import { supabase } from '/assets/js/supabase-client.js';
  import { requireDraftOrRedirect, saveDraft, renderSummaryRail, renderStepper } from '/assets/js/booking-draft.js';
  mountChrome('packages');

  const draft = requireDraftOrRedirect();
  if (draft) {
    renderStepper(document.getElementById('stepperRoot'), 'patient');
    renderSummaryRail(document.getElementById('summaryRoot'), draft);

    // Prefill from the logged-in profile, if any (mirrors the original
    // modal's prefill-from-currentUser behavior) — never required.
    supabase.auth.getUser().then(({ data }) => {
      const u = data?.user;
      if (!u) return;
      const nameEl = document.getElementById('pName');
      const emailEl = document.getElementById('pEmail');
      const phoneEl = document.getElementById('pPhone');
      if (nameEl && !nameEl.value) nameEl.value = u.user_metadata?.full_name || '';
      if (emailEl && !emailEl.value) emailEl.value = u.email || '';
      if (phoneEl && !phoneEl.value) phoneEl.value = u.user_metadata?.phone || '';
    });

    // Restore anything already filled if the user came back to this step.
    if (draft.patientName) document.getElementById('pName').value = draft.patientName;
    if (draft.patientPhone) document.getElementById('pPhone').value = draft.patientPhone;
    if (draft.patientEmail) document.getElementById('pEmail').value = draft.patientEmail;
    if (draft.patientDob) document.getElementById('pDob').value = draft.patientDob;
    if (draft.patientGender) document.getElementById('pGender').value = draft.patientGender;
  }

  function validate() {
    let valid = true;
    const name = document.getElementById('pName');
    const phone = document.getElementById('pPhone');
    const email = document.getElementById('pEmail');

    const nameOk = /^[a-zA-Z\s]{2,}$/.test(name.value.trim());
    document.getElementById('pNameErr').classList.toggle('show', !nameOk);
    name.classList.toggle('error', !nameOk);
    if (!nameOk) valid = false;

    const phoneOk = /^[6-9]\d{9}$/.test(phone.value.trim());
    document.getElementById('pPhoneErr').classList.toggle('show', !phoneOk);
    phone.classList.toggle('error', !phoneOk);
    if (!phoneOk) valid = false;

    const emailVal = email.value.trim();
    const emailOk = !emailVal || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal);
    document.getElementById('pEmailErr').classList.toggle('show', !emailOk);
    email.classList.toggle('error', !emailOk);
    if (!emailOk) valid = false;

    return valid;
  }

  document.getElementById('patientForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!validate()) return;
    saveDraft({
      patientName: document.getElementById('pName').value.trim(),
      patientPhone: document.getElementById('pPhone').value.trim(),
      patientEmail: document.getElementById('pEmail').value.trim() || null,
      patientDob: document.getElementById('pDob').value || null,
      patientGender: document.getElementById('pGender').value || null,
    });
    location.href = '/booking/collection.html';
  });
</script>
</html>
